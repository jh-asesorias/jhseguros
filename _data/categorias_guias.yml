# =========================================================
# CATEGORÍAS DE LAS GUÍAS (Recursos)
# Cada guía lleva en su encabezado "categoria: gmm" (o ppr, educacion, vida, auto, hogar, asesoria).
# Aquí se define, una sola vez, cómo se ve cada categoría:
#   nombre   = texto de la etiqueta y del filtro
#   lema     = frase corta de la tarjeta de categoría
#   foto     = imagen de la carpeta /imagenes/ (sin texto ni logos)
#   og       = imagen para compartir en redes (Facebook, WhatsApp)
#   producto = página del seguro relacionado (no se cambia ninguna URL)
#   boton    = texto del botón hacia esa página
# El orden de esta lista es el orden en que aparecen en /recursos/.
# =========================================================
- clave: gmm
  nombre: Gastos Médicos Mayores
  lema: Deducible, coaseguro, hospitales y coberturas
  foto: /imagenes/gmm-01-hospital.webp
