name: Generador Automatico de Paginas HTML y Sitemap SEO

on:
  push:
    paths:
      - 'Guias/**'
      - 'index.html'
      - 'scripts/**'
      - '*.html'
      - '*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Hornear paginas HTML y Sitemap SEO
      run: node scripts/generar-seo.js

    - name: Commit and push generated HTML files and Sitemap
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 SEO: Bake physical HTML sections and sitemap [skip ci]"
        file_pattern: '*.html recursos/*.html sitemap.xml'

    - name: ⚡ Notificar a Bing (IndexNow)
      run: |
        curl -L "https://www.bing.com/ping?sitemap=https://jhseguros.mx/sitemap.xml"
