name: Generador Automatico de Paginas HTML y Sitemap SEO

on:
  push:
    paths:
      - 'Guias/**'
      - '*.html'
      - '*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Hornear paginas HTML y generar Sitemap
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');

        const guiasDir = path.join(process.cwd(), 'Guias');
        const recursosDir = path.join(process.cwd(), 'recursos');
        const domain = 'https://jhseguros.mx';

        if (!fs.existsSync(recursosDir)) {
            fs.mkdirSync(recursosDir, { recursive: true });
        }

        // 1. CONVERSOR AUTOMÁTICO DE BORRADORES .MD A PÁGINAS WEB (RUTAS LIMPIAS)
        let xmlUrls = [];
        
        if (fs.existsSync(guiasDir)) {
            const files = fs.readdirSync(guiasDir);
            files.forEach(file => {
                if (file.endsWith('.md') && !file.startsWith('.')) {
                    const rawName = file.replace('.md', '');
                    const mdPath = path.join(guiasDir, file);
                    let content = fs.readFileSync(mdPath, 'utf8');

                    // Extraer título limpio
                    const titleMatch = content.match(/^#\s+(.+)$/m);
                    const title = titleMatch ? titleMatch[1].trim() : rawName.replace(/[-_]/g, ' ');

                    // Convertir formato básico Markdown a HTML
                    let htmlBody = content
                        .replace(/^#\s+(.+)$/gm, '<h1>$1</h1>')
                        .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
                        .replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
                        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.+?)\*/g, '<em>$1</em>')
                        .replace(/^\n|\n$/g, '')
                        .split(/\n\n+/).map(p => p.startsWith('<h') || p.startsWith('<div') || p.startsWith('<script') ? p : '<p>' + p + '</p>').join('\n');

                    // Plantilla HTML oficial de JH Asesorías
                    const htmlFull = \`<!DOCTYPE html>
        <html lang=\"es-MX\">
        <head>
            <meta charset=\"UTF-8\">
            <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
            <title>\${title} | JH División SEGUROS</title>
            <meta name=\"description\" content=\"Guía especializada sobre \${title}. Asesoría patrimonial y seguros en México por el Agente Certificado Rafael Jiménez Sánchez.\">
            <link rel=\"canonical\" href=\"\${domain}/recursos/\${rawName}/\">
            <link rel=\"stylesheet\" href=\"/style.css\" onerror=\"this.onerror=null;this.removeAttribute('rel');\">
            <style>
                body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; color: #1e293b; max-width: 850px; margin: 0 auto; padding: 20px; }
                header { border-bottom: 2px solid #0f172a; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
                .logo { font-weight: bold; font-size: 1.2rem; color: #0f172a; text-decoration: none; }
                h1 { color: #0f172a; font-size: 1.8rem; line-height: 1.3; }
                h2 { color: #1e293b; margin-top: 25px; font-size: 1.4rem; }
                .cta-btn { display: inline-block; background-color: #25d366; color: white; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; margin-top: 20px; }
                footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 0.9rem; color: #64748b; text-align: center; }
            </style>
        </head>
        <body>
            <header>
                <a href=\"/\" class=\"logo\">JH DIVISION SEGUROS</a>
                <a href=\"/\" style=\"color: #2563eb; text-decoration: none;\">← Volver al Inicio</a>
            </header>
            <main>
                \${htmlBody}
                <div style=\"text-align: center; margin-top: 30px;\">
                    <a href=\"https://wa.me/528343117556?text=Hola%20Rafael,%20necesito%20asesoria%20sobre%20\${encodeURIComponent(title)}\" class=\"cta-btn\" target=\"_blank\">Consultar con un Agente Certificado</a>
                </div>
            </main>
            <footer>
                <p>© \${new Date().getFullYear()} JH Asesorías - Agente Certificado CNSF H382035 Rafael Jiménez Sánchez.</p>
            </footer>
        </body>
        </html>\`;

                    // Crear subcarpeta para URL Limpia (SEO)
                    const guideDir = path.join(recursosDir, rawName);
                    if (!fs.existsSync(guideDir)) {
                        fs.mkdirSync(guideDir, { recursive: true });
                    }
                    fs.writeFileSync(path.join(guideDir, 'index.html'), htmlFull);
                    xmlUrls.push(\`\${domain}/recursos/\${rawName}/\`);
                }
            });
            console.log('🤖 Robot: Paginas HTML generadas con exito en subcarpetas /recursos/');
        }

        // 2. CONSTRUCCIÓN DEL SITEMAP.XML
        let xml = '<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n';
        xml += '<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">\n';
        xml += '  <url>\n    <loc>' + domain + '/</loc>\n    <priority>1.0</priority>\n  </url>\n';

        const seccionesFijas = ['danos', 'productos-vida', 'faq', 'hospitales', 'autorizaciones', 'certificaciones', 'recursos'];
        seccionesFijas.forEach(seccion => {
            xml += '  <url>\n    <loc>' + domain + '/' + seccion + '</loc>\n    <priority>0.9</priority>\n  </url>\n';
        });

        xmlUrls.forEach(url => {
            xml += '  <url>\n';
            xml += '    <loc>' + url + '</loc>\n';
            xml += '    <priority>0.8</priority>\n';
            xml += '  </url>\n';
        });

        xml += '</urlset>';
        fs.writeFileSync(path.join(process.cwd(), 'sitemap.xml'), xml);
        console.log('🤖 Robot: Sitemap.xml actualizado correctamente.');
        "

    - name: Commit and push generated HTML and Sitemap
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 SEO: Bake HTML pages from Markdown guides and update sitemap"
        file_pattern: 'recursos/** sitemap.xml'
