<!-- =========================================================
     MENÚ SUPERIOR ÚNICO DE JH SEGUROS
     Se usa en todas las páginas con la instrucción include header.html
     (entre llaves y porcentajes), justo después de la etiqueta body.
     Para cambiar un enlace o un texto del menú, se edita SOLO este
     archivo y se actualiza todo el sitio.
     - Computadora (901 px o más): barra fija arriba al bajar la página.
     - Celular y tableta: barra normal con botón de menú (☰).
     ========================================================= -->
<style>
    /* Estilos propios del menú (prefijo jhh- para no chocar con los de cada página).
       Se usan etiquetas div y no header/nav porque cada página ya da estilo a "header". */
    .jhh-bar { position: relative; z-index: 2100; background-color: #ffffff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 2px 12px rgba(18, 38, 79, 0.08); font-family: 'Montserrat', 'Open Sans', sans-serif; }
    .jhh-inner { max-width: 1180px; margin: 0 auto; padding: 0 20px; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    /* Marca: logo JH pequeño + nombre + leyenda */
    .jhh-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
    .jhh-brand img { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; flex-shrink: 0; }
    .jhh-brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
    .jhh-name { font-size: 1rem; font-weight: 700; color: #12264f; white-space: nowrap; }
    .jhh-role { font-family: 'Open Sans', sans-serif; font-size: 0.72rem; font-weight: 600; color: #6c4bc4; letter-spacing: 0.02em; white-space: nowrap; }

    /* Enlaces del menú (computadora) */
    .jhh-nav { display: flex; align-items: center; gap: 6px; }
    .jhh-link { font-size: 0.92rem; font-weight: 600; color: #1e3c72; text-decoration: none; padding: 8px 12px; border-radius: 8px; transition: background-color 0.2s, color 0.2s; }
    .jhh-link:hover { background-color: #eef3fb; color: #4b2a85; }
    .jhh-wa { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; margin-left: 6px; border-radius: 50%; background-color: #25d366; color: #ffffff; transition: transform 0.2s; }
    .jhh-wa:hover { transform: scale(1.08); }

    /* Botón ☰ y panel (solo celular y tableta) */
    .jhh-toggle { display: none; align-items: center; justify-content: center; width: 42px; height: 42px; border: none; border-radius: 10px; background-color: #1e3c72; color: #ffffff; cursor: pointer; flex-shrink: 0; }
    .jhh-panel { display: none; background-color: #ffffff; border-top: 1px solid #e2e8f0; padding: 8px 20px 16px; box-shadow: 0 10px 20px rgba(18, 38, 79, 0.12); }
    .jhh-panel.jhh-open { display: block; }
    .jhh-panel a { display: block; padding: 12px 4px; font-weight: 600; font-size: 1rem; color: #1e3c72; text-decoration: none; border-bottom: 1px solid #eef3fb; }
    .jhh-panel .jhh-sec { font-family: 'Open Sans', sans-serif; font-weight: 400; font-size: 0.92rem; color: #444444; }
    .jhh-panel .jhh-panel-wa { color: #128c4b; }

    /* El menú anterior de cada página queda oculto: este lo reemplaza */
    .mobile-menu-btn, .mobile-overlay, .mobile-backdrop { display: none !important; }

    /* Computadora: barra fija arriba y espacio para que no tape el contenido */
    @media (min-width: 901px) {
        .jhh-bar { position: fixed; top: 0; left: 0; right: 0; }
        body { padding-top: 68px; }
        [id] { scroll-margin-top: 84px; }
    }

    /* Celular y tableta: se ocultan los enlaces y aparece el botón ☰ */
    @media (max-width: 900px) {
        .jhh-nav { display: none; }
        .jhh-toggle { display: inline-flex; }
        .jhh-inner { height: 62px; }
        .jhh-name { font-size: 0.95rem; }
    }
</style>

<div class="jhh-bar" role="banner">

        <a href="/hospitales/" class="jhh-sec">Servicios hospitalarios</a>
        <a href="/recursos/" class="jhh-sec">Respuestas sobre seguros</a>
        <a href="/redes/" class="jhh-sec">Redes sociales</a>
    </div>
</div>

<script>
    (function () {
        // Abre y cierra el panel del menú en celular
        var boton = document.getElementById('jhhToggle');
        var panel = document.getElementById('jhhPanel');
        if (!boton || !panel) return;

        boton.addEventListener('click', function () {
            var abierto = panel.classList.toggle('jhh-open');
            boton.setAttribute('aria-expanded', abierto ? 'true' : 'false');
            boton.setAttribute('aria-label', abierto ? 'Cerrar menú' : 'Abrir menú');
        });

        // Al elegir una opción, el panel se cierra
        panel.addEventListener('click', function (e) {
            if (e.target.closest('a')) {
                panel.classList.remove('jhh-open');
                boton.setAttribute('aria-expanded', 'false');
                boton.setAttribute('aria-label', 'Abrir menú');
            }
        });
    })();
</script>
